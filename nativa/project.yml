name: BirrasPro
options:
  bundleIdPrefix: es.david
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: es
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  BirrasPro:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["puente.js", "Info.plist"]
      - path: App/puente.js
        buildPhase: resources
      - path: Compartido
      - path: ../docs/logica.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.david.birras.pro
        PRODUCT_NAME: BirrasPro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Birras Pro
        GENERATE_INFOPLIST_FILE: "NO"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Birras Pro
        CFBundleDevelopmentRegion: es
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CADisableMinimumFrameDurationOnPhone: true
        NSSupportsLiveActivities: true
        NSPhotoLibraryUsageDescription: Para elegir las fotos de perfil
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    dependencies:
      - target: BirrasWidgets
        embed: true
  BirrasWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
        excludes: ["Info.plist"]
      - path: Compartido
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.david.birras.pro.widgets
        PRODUCT_NAME: BirrasWidgets
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Birras
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  BirrasPro:
    build:
      targets:
        BirrasPro: all
        BirrasWidgets: all
